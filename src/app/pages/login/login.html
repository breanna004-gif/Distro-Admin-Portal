<div class="login-page">

  <div class="login-container">

    <div class="brand-section">

      <div class="brand-logo">
        <img class="theme-logo theme-logo--light" src="/mydistro-logo-light.svg" alt="" />
        <img class="theme-logo theme-logo--dark" src="/mydistro-logo-dark.svg" alt="" />
      </div>

      <h1>MyDistro</h1>

<p>
  Logistics Platform
</p>

      <p>
        Admin Portal
      </p>

    </div>


    <div class="login-card">

      <div class="login-header">

        <h2>
          Welcome back
        </h2>

        <p>
          Sign in to access the administration portal.
        </p>

      </div>

      @if (errorMessage) {

        <div class="error-message">
          {{ errorMessage }}
          @if (showVerificationLink) {
            <a
              class="verification-link"
              routerLink="/verification"
            >
              Verify your account
            </a>
          }
        </div>

      }


      <form (ngSubmit)="login()">

        <div class="form-group">

          <label for="email">
            Email or phone number
          </label>

          <input
            id="email"
            type="text"
            name="email"
            [(ngModel)]="email"
            placeholder="Email or phone number"
            autocomplete="username"
            required
          />

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />

        </div>


        <div class="login-options">

          <label class="remember-me">

            <input
              type="checkbox"
            />

            <span>
              Remember me
            </span>

          </label>


          <button
            type="button"
            class="forgot-password"
          >
            Forgot password?
          </button>

        </div>


        <button
          type="submit"
          class="login-button"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Signing in...' : 'Sign In' }}
        </button>

      </form>


      <!-- SIGN UP LINK -->
<div class="signup-section">
  <span>Don't have an account?</span>

  <a routerLink="/signup">
    Sign up
  </a>
</div>

<!-- Login Footer -->
<div class="login-footer">
  <span>MyDistro Administration Platform</span>
</div>
      </div>

    </div>

  </div>
