<div class="signup-page">
  <div class="signup-card">
    <div class="signup-header">
      <div class="brand-icon">
        <img src="/logiflow-logo.svg" alt="" />
      </div>
      <h1>Create your account</h1>
      <p>Register to join the supply chain management platform</p>
    </div>

    @if (errorMessage) {
      <div class="message error" role="alert">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="submitRegistration()" #signupForm="ngForm">
      <div class="form-section">
        <h2>Personal information</h2>

        <div class="form-group">
          <label for="fullName">Full name *</label>
          <input
            id="fullName"
            type="text"
            name="fullName"
            [(ngModel)]="fullName"
            autocomplete="name"
            placeholder="Michelle Makimei"
            required
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email address *</label>
            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="phoneNumber">Phone number *</label>
            <input
              id="phoneNumber"
              type="tel"
              name="phoneNumber"
              [(ngModel)]="phoneNumber"
              autocomplete="tel"
              placeholder="+254712345678"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="72"
            required
          />
          <span class="field-hint">
            8–72 characters, with uppercase and lowercase letters and at least one digit.
          </span>
        </div>
      </div>

      <div class="form-section">
        <h2>Account information</h2>

        <div class="form-group">
          <label for="role">Account type *</label>
          <select id="role" name="role" [(ngModel)]="role" required>
            @for (registrationRole of registrationRoles; track registrationRole.value) {
              <option [ngValue]="registrationRole.value">
                {{ registrationRole.label }}
              </option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="organizationName">Organization name *</label>
          <input
            id="organizationName"
            type="text"
            name="organizationName"
            [(ngModel)]="organizationName"
            autocomplete="organization"
            placeholder="SupplyChain HQ"
            required
          />
        </div>
      </div>

      <button
        type="submit"
        class="signup-button"
        [disabled]="loading || signupForm.invalid"
      >
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <div class="login-link">
      Already have an account?
      <button type="button" (click)="goToLogin()">Sign in</button>
    </div>
  </div>
</div>
