
<div class="report-download">

  <div class="download-actions">

    <button
      *ngIf="showExcel"
      type="button"
      class="download-button excel-button"
      [disabled]="!hasData"
      (click)="downloadExcel()"
      title="Export as Excel"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <path d="m8 13 4 5"/>
        <path d="m12 13-4 5"/>
      </svg>

      <span>Excel</span>
    </button>

    <button
      *ngIf="showPdf"
      type="button"
      class="download-button pdf-button"
      [disabled]="!hasData"
      (click)="downloadPdf()"
      title="Export as PDF"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <path d="M8 13h2a2 2 0 0 1 0 4H8z"/>
        <path d="M14 17v-4h2a2 2 0 0 1 0 4z"/>
      </svg>

      <span>PDF</span>
    </button>

  </div>

  <p
    class="download-error"
    *ngIf="exportError"
    role="alert"
  >
    {{ exportError }}
  </p>

  <p
    class="download-hint"
    *ngIf="!hasData"
  >
    No records available to export.
  </p>

</div>
